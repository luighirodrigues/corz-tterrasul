services:
  postgres:
    image: postgres:16-alpine
    container_name: corz_qualidade_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: corz_qualidade
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Só para desenvolvimento: um SMTP de mentira. Os e-mails de resumo não saem de verdade;
  # eles aparecem em http://localhost:8025. No .env: SMTP_HOST=localhost, SMTP_PORT=1025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: corz_qualidade_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
